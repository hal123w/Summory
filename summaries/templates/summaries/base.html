{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Summory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'summaries/summory.css' %}">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="shell">
    <header class="top">
      <p class="brand"><a href="{% url 'summaries:create' %}">Summory</a></p>
      {% if user.is_authenticated %}
      <div class="top-actions">
        <nav class="nav" aria-label="メイン">
          <a href="{% url 'summaries:create' %}" class="{% if nav == 'create' %}is-active{% endif %}">新規要約</a>
          <a href="{% url 'summaries:list' %}" class="{% if nav == 'list' %}is-active{% endif %}">履歴</a>
        </nav>
        <form method="post" action="{% url 'summaries:logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="logout-link">ログアウト</button>
        </form>
      </div>
      {% endif %}
    </header>

    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
